<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v5.11.2/css/all.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
   
    <title> Welcome | PGLife </title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" class="nav-img"/>
            </a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
               <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#loginModal">
                            <i class="fas fa-sign-in-alt"></i> SignIn
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#signupModal">
                            <i class="fas fa-user"></i> SignUp
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
    <div class="row" id="results"></div>
</div>
    <section class="banner-container">
        <div class="container text-center text-black">
            <h1>Happiness Per Square Foot</h1>
            <p> Find Your Perfect PG </p>
            <div class="search-box mt-4 d-flex">
                <input id="searchInput" type="text" class="form-control" placeholder="Search Here">
                <button class="btn btn-warning" onclick="searchPG()">Search</button>
            </div>
        </div>
    </section>
  
    <script>
        function searchPG(){
    let search = document.getElementById("searchInput").value;

    fetch("http://localhost/Project_PGLife/api/search.php?city=" + search)
    .then(res => res.json())
    .then(data => {

        let container = document.getElementById("results");
        container.innerHTML = "";

        data.forEach(item => {

            container.innerHTML += `
    <div class="col-md-4 mb-4">
        <div class="property-card">
            <h5>${item.name}</h5>
            <p>${item.address}</p>
            <div class="price">₹ ${item.rent}</div>

            <a href="property_details.html?id=${item.id}">
                View
            </a>
        </div>
    </div>
`;
        });
        document.getElementById("searchInput").addEventListener("input", function () {
    searchPG();
});
if (data.length === 0) {
    document.getElementById("results").innerHTML =
        "<p class='text-center mt-4'>No PG found 😢</p>";
    return;
}

    });
}
    </script>
    <div class="page-container">
        <h1 class="city-heading">
            Major Cities
        </h1>
        <div class="row justify-content-center g-4">
            <div class="city-card-container col-auto">
                <a href="property_list.html">
                    <div class="city-card rounded-circle">
                        <img src="img/delhi.png" class="city-img" />
                    </div>
                </a>
            </div>

            <div class="city-card-container col-auto">
                <a href="property_list.html">
                    <div class="city-card rounded-circle">
                        <img src="img/mumbai.png" class="city-img" />
                    </div>
                </a>
            </div>

            <div class="city-card-container col-auto">
                <a href="property_list.html">
                    <div class="city-card rounded-circle">
                        <img src="img/bangalore.png" class="city-img" />
                    </div>
                </a>
            </div>

            <div class="city-card-container col-auto">
                <a href="property_list.html">
                    <div class="city-card rounded-circle">
                        <img src="img/hyderabad.png" class="city-img" />
                    </div>
                </a>
            </div>
        </div>
    </div>

   <div class="modal fade" id="loginModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>SignIn</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="login-form">
                    <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
                    <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary w-100">SignIn</button>
                </form>
            </div>

        </div>
    </div>
</div>
    <div class="modal fade" id="signupModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5>SignUp with PGLife </h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="signup-form">
                      <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" name="full_name" class="form-control" placeholder="Full Name" required>
                      </div>

                      <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-phone-alt"></i>
                        </span>
                        <input type="tel"  name="phone" class="form-control" placeholder="Phone Number" required>
                      </div>
                      
                      <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" name="email" class="form-control" placeholder="Email" required>
                      </div>

                      <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                      </div>

                      <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fas fa-building"></i>
                        </span>
                        <input type="text" name="college" class="form-control" placeholder="College Name" required>
                      </div>

                      <div class="mb-3">
                        <span> I'm a:</span>
                        <input type="radio" id="male" name="gender" value="male" class="ms-2">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="female" class="ms-2">
                        <label for="female">Female</label>
                      </div>

                      <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <span> Already have an account ?</span>
                    <a href="#" data-bs-dismiss="modal" data-bs-toggle="modal"  data-bs-target="#loginModal">
                        SignIn
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById("signup-form").addEventListener("submit",function(e){
            e.preventDefault();
            
            let formData = new FormData(this);

            fetch("http://localhost/Project_PGLife/api/signup.php",{
                method:"POST",
                body : formData
            })
            .then (res => res.text())
            .then (data =>{
                alert(data)
            })
        })

       document.getElementById("login-form").addEventListener("submit", function(e){
    e.preventDefault();

    let formData = new FormData(this);

    fetch("api/login.php", {   
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => {
        console.log(data);

        if(data.trim() === "success"){
            window.location.href = "property_list.html";
        } else {
            alert("Invalid email or password");
        }
    });
});
    </script>

            <div class="footer-city">

            <div class="footer-city">

            <div class="footer-copyright text-light-emphasis">© 2026 Copyright PG Life</div>
        </div>

</body>
</html>
